name: Monday Item Connection Check

on:
  workflow_call:

jobs:
  check-monday-connection:
    name: Verify Monday Item Connection
    runs-on: ubuntu-latest

    steps:
      - name: Check Branch Name for Monday Item ID
        id: check-branch
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          echo "Branch name: $BRANCH_NAME"

          if echo "$BRANCH_NAME" | grep -qE '[0-9]{8,}'; then
            FOUND_ID=$(echo "$BRANCH_NAME" | grep -oE '[0-9]{8,}' | head -1)
            echo "found_id=$FOUND_ID" >> $GITHUB_OUTPUT
            echo "valid=true" >> $GITHUB_OUTPUT
            echo "✅ Branch name contains Monday Item ID: $FOUND_ID"
          else
            echo "valid=false" >> $GITHUB_OUTPUT
            echo "ℹ️ Branch name does not contain a Monday Item ID"
          fi

      - name: Check PR Title for Monday Item ID
        id: check-title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "PR title: $PR_TITLE"

          if echo "$PR_TITLE" | grep -qE '[0-9]{8,}'; then
            FOUND_ID=$(echo "$PR_TITLE" | grep -oE '[0-9]{8,}' | head -1)
            echo "found_id=$FOUND_ID" >> $GITHUB_OUTPUT
            echo "valid=true" >> $GITHUB_OUTPUT
            echo "✅ PR title contains Monday Item ID: $FOUND_ID"
          else
            echo "valid=false" >> $GITHUB_OUTPUT
            echo "ℹ️ PR title does not contain a Monday Item ID"
          fi

      - name: Check PR Description for Monday Link
        id: check-description
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          echo "Checking PR description for Monday link..."

          if echo "$PR_BODY" | grep -qiE 'monday\.com.*/pulses/[0-9]+'; then
            MONDAY_URL=$(echo "$PR_BODY" | grep -oiE 'https?://[^[:space:]]*monday\.com[^[:space:]]*pulses/[0-9]+[^[:space:]]*' | head -1)
            MONDAY_ITEM_ID=$(echo "$MONDAY_URL" | grep -oE 'pulses/[0-9]+' | grep -oE '[0-9]+')
            echo "monday_url=$MONDAY_URL" >> $GITHUB_OUTPUT
            echo "found_id=$MONDAY_ITEM_ID" >> $GITHUB_OUTPUT
            echo "valid=true" >> $GITHUB_OUTPUT
            echo "✅ PR description contains Monday link: $MONDAY_URL (Item ID: $MONDAY_ITEM_ID)"
          elif echo "$PR_BODY" | grep -qE '[0-9]{8,}'; then
            FOUND_ID=$(echo "$PR_BODY" | grep -oE '[0-9]{8,}' | head -1)
            echo "found_id=$FOUND_ID" >> $GITHUB_OUTPUT
            echo "valid=true" >> $GITHUB_OUTPUT
            echo "✅ PR description contains Monday Item ID: $FOUND_ID"
          else
            echo "valid=false" >> $GITHUB_OUTPUT
            echo "ℹ️ PR description does not contain a Monday Item ID or link"
          fi

      - name: Generate Summary
        env:
          BRANCH_VALID: ${{ steps.check-branch.outputs.valid }}
          TITLE_VALID: ${{ steps.check-title.outputs.valid }}
          DESC_VALID: ${{ steps.check-description.outputs.valid }}
          BRANCH_ID: ${{ steps.check-branch.outputs.found_id }}
          TITLE_ID: ${{ steps.check-title.outputs.found_id }}
          DESC_ID: ${{ steps.check-description.outputs.found_id }}
        run: |
          echo "## Monday Item Connection Check Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$BRANCH_VALID" == "true" ]; then
            echo "✅ **Branch Name**: Contains Monday Item ID \`$BRANCH_ID\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "⬜ **Branch Name**: No Monday Item ID found" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$TITLE_VALID" == "true" ]; then
            echo "✅ **PR Title**: Contains Monday Item ID \`$TITLE_ID\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "⬜ **PR Title**: No Monday Item ID found" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$DESC_VALID" == "true" ]; then
            echo "✅ **PR Description**: Contains Monday Item ID \`$DESC_ID\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "⬜ **PR Description**: No Monday Item ID found" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$BRANCH_VALID" == "true" ] || [ "$TITLE_VALID" == "true" ] || [ "$DESC_VALID" == "true" ]; then
            echo "### ✅ SOC2 Compliance: PASSED" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "A Monday Item ID was found in at least one location." >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ SOC2 Compliance: FAILED" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "No Monday Item ID found. Please add one in **any** of the following:" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "1. **Branch name** — e.g., \`feature/1234567890-add-feature\`" >> $GITHUB_STEP_SUMMARY
            echo "2. **PR title** — e.g., \`Add feature - [1234567890]\`" >> $GITHUB_STEP_SUMMARY
            echo "3. **PR description** — add a Monday.com link, e.g., \`https://yourcompany.monday.com/boards/xxxxx/pulses/1234567890\`" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Fail if Requirements Not Met
        if: steps.check-branch.outputs.valid != 'true' && steps.check-title.outputs.valid != 'true' && steps.check-description.outputs.valid != 'true'
        env:
          BRANCH_NAME: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo ""
          echo "=========================================="
          echo "❌ SOC2 COMPLIANCE CHECK FAILED"
          echo "=========================================="
          echo ""
          echo "No Monday Item ID was found in any of:"
          echo "  - Branch name: $BRANCH_NAME"
          echo "  - PR title: $PR_TITLE"
          echo "  - PR description"
          echo ""
          echo "To fix this, add a Monday Item ID (8+ digits) in at least ONE of:"
          echo ""
          echo "  1. Branch name:"
          echo "     git checkout -b feature/<monday-item-id>-<description>"
          echo ""
          echo "  2. PR title:"
          echo "     Add the Monday Item ID, e.g.: 'Add feature - [1234567890]'"
          echo ""
          echo "  3. PR description:"
          echo "     Add the Monday ticket link:"
          echo "     🔗 Monday Ticket: https://yourcompany.monday.com/boards/xxxxx/pulses/<item-id>"
          echo ""
          echo "=========================================="
          exit 1
