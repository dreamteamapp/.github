name: PR Scope Review

on:
  workflow_call:
    secrets:
      GEMINI_API_KEY:
        required: true

jobs:
  pr-scope-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Get PR diff
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          gh api "repos/${REPO}/pulls/${PR_NUMBER}" \
            -H "Accept: application/vnd.github.v3.diff" > pr.diff

          # Truncate to ~100KB to stay within API limits
          head -c 100000 pr.diff > pr_truncated.diff

          # Use randomized delimiter to prevent injection via diff content
          DELIM="EOF_$(openssl rand -hex 16)"

          echo "diff<<${DELIM}" >> "$GITHUB_OUTPUT"
          cat pr_truncated.diff >> "$GITHUB_OUTPUT"
          echo "${DELIM}" >> "$GITHUB_OUTPUT"

          echo "title<<${DELIM}_TITLE" >> "$GITHUB_OUTPUT"
          echo "${PR_TITLE}" >> "$GITHUB_OUTPUT"
          echo "${DELIM}_TITLE" >> "$GITHUB_OUTPUT"

          PR_DATA=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq '{changed_files, additions, deletions}')
          echo "files_changed=$(echo "$PR_DATA" | jq -r '.changed_files')" >> "$GITHUB_OUTPUT"
          echo "additions=$(echo "$PR_DATA" | jq -r '.additions')" >> "$GITHUB_OUTPUT"
          echo "deletions=$(echo "$PR_DATA" | jq -r '.deletions')" >> "$GITHUB_OUTPUT"

      - name: Analyze PR scope
        id: analyze
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PR_TITLE: ${{ steps.diff.outputs.title }}
          PR_FILES: ${{ steps.diff.outputs.files_changed }}
          PR_ADDITIONS: ${{ steps.diff.outputs.additions }}
          PR_DELETIONS: ${{ steps.diff.outputs.deletions }}
          PR_DIFF: ${{ steps.diff.outputs.diff }}
        run: |
          PROMPT="Review this pull request and evaluate whether it should be split into smaller PRs.
          Do NOT review code quality, bugs, style, security, or anything else — focus ONLY on whether this PR should be split.

          Flag the PR if it has EITHER of these problems:

          1. Mixed concerns — the PR bundles multiple independent pieces of work that could each stand on their own (e.g. a bug fix with a refactor, a new feature with unrelated cleanup, multiple independent features). Even a small PR can have this.

          2. Sheer size — the PR changes so many lines or files that it becomes difficult to review meaningfully, even if it is technically one concern. Use your judgement — a large migration or generated code is fine, but a massive hand-written feature that could be delivered incrementally is not.

          If the PR should be split, respond with a JSON object: {\"should_split\": true, \"comment\": \"your markdown comment explaining why and how to split\"}
          If the PR is focused and reviewable, respond with: {\"should_split\": false}

          Respond ONLY with the JSON object, no other text.

          ## PR Info
          Title: ${PR_TITLE}
          Files changed: ${PR_FILES}
          Additions: ${PR_ADDITIONS}
          Deletions: ${PR_DELETIONS}

          ## Diff
          ${PR_DIFF}"

          PAYLOAD=$(jq -n --arg prompt "$PROMPT" '{
            contents: [{
              parts: [{
                text: $prompt
              }]
            }],
            generationConfig: {
              temperature: 0.2,
              maxOutputTokens: 1024,
              responseMimeType: "application/json"
            }
          }')

          RESPONSE=$(curl -s "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${GEMINI_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          CONTENT=$(echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text // empty')

          if [ -z "$CONTENT" ]; then
            echo "API error: $RESPONSE"
            exit 0
          fi

          SHOULD_SPLIT=$(echo "$CONTENT" | jq -r '.should_split // false')
          echo "should_split=$SHOULD_SPLIT" >> "$GITHUB_OUTPUT"

          if [ "$SHOULD_SPLIT" = "true" ]; then
            COMMENT=$(echo "$CONTENT" | jq -r '.comment')
            DELIM="EOF_$(openssl rand -hex 16)"
            echo "comment<<${DELIM}" >> "$GITHUB_OUTPUT"
            echo "$COMMENT" >> "$GITHUB_OUTPUT"
            echo "${DELIM}" >> "$GITHUB_OUTPUT"
          fi

      - name: Post comment if PR should be split
        if: steps.analyze.outputs.should_split == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMENT_BODY: ${{ steps.analyze.outputs.comment }}
        run: |
          EXISTING=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" \
            --jq '[.[] | select(.body | startswith("<!-- pr-scope-review -->"))] | length')

          if [ "$EXISTING" -gt "0" ]; then
            echo "Comment already exists, skipping"
            exit 0
          fi

          BODY="<!-- pr-scope-review -->
          ${COMMENT_BODY}"

          gh pr comment "${PR_NUMBER}" --repo "${REPO}" --body "$BODY"
